name: Build, Push e Deploy — diva-api

on:
  push:
    branches:
      - develop
  release:
    types:
      - published

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/diva-api

jobs:
  build-and-push:
    name: Build e push da imagem
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build e push da imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy no servidor CGTI
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            mkdir -p /opt/diva/api

            cat > /opt/diva/api/.env << 'EOF'
            GITHUB_REPOSITORY_OWNER=${{ github.repository_owner }}
            NODE_ENV=production
            PORT=${{ secrets.PORT }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            AZURE_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}
            AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}
            AZURE_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET }}
            SP_DRIVE_ID_CTRL=${{ secrets.SP_DRIVE_ID_CTRL }}
            SP_ITEM_ID_CTRL=${{ secrets.SP_ITEM_ID_CTRL }}
            SP_DRIVE_ID_OS=${{ secrets.SP_DRIVE_ID_OS }}
            SP_ITEM_ID_OS=${{ secrets.SP_ITEM_ID_OS }}
            SP_SITE_ID_OS=${{ secrets.SP_SITE_ID_OS }}
            EOF

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /opt/diva/api
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
